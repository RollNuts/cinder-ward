name: Asset Intake
description: Approve an asset before adding it to the public repo or game build.
title: "[asset] "
labels: ["type:asset", "risk:license", "status:triage"]
body:
  - type: input
    id: asset_name
    attributes:
      label: Asset name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL or local origin
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: License and commercial-use proof
    validations:
      required: true
  - type: dropdown
    id: generated
    attributes:
      label: Generated by AI or paid API?
      options:
        - "no"
        - "yes - free/local"
        - "yes - paid/API"
        - "unknown"
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Intended use
    validations:
      required: true

